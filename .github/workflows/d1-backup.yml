name: Encrypted D1 backup

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backup secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BACKUP_PASSWORD"

      - name: Export and encrypt D1
        run: |
          mkdir -p backup-output
          backup_file="backup-output/trap-game-db-$(date -u +%Y-%m-%dT%H-%M-%SZ).sql"
          npx --yes wrangler@4 d1 export trap-game-db --remote --output="$backup_file"
          gzip "$backup_file"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$backup_file.gz" \
            -out "$backup_file.gz.enc" \
            -pass env:BACKUP_PASSWORD
          rm "$backup_file.gz"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: trap-d1-${{ github.run_id }}
          path: backup-output/*.enc
          if-no-files-found: error
          retention-days: 30

